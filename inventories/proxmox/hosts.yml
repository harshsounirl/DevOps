---
# Static inventory placeholder.
# In production, replace with Proxmox dynamic inventory plugin:
#   community.general.proxmox
#
# Dynamic inventory example (inventories/proxmox/proxmox.yml):
#   plugin: community.general.proxmox
#   url: https://proxmox.example.com:8006
#   user: root@pam
#   password: "{{ vault_proxmox_password }}"
#   validate_certs: false
#   want_facts: true

all:
  children:
    proxmox_vms:
      hosts: {}        # Populated dynamically by add_host during playbook run

    newly_provisioned:
      hosts: {}        # Populated at runtime by provision_rhel_vm.yml
