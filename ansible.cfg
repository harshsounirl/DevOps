[defaults]
# Inventory location
inventory           = inventories/proxmox/hosts.yml

# Vault password file (create this file with your vault password, never commit it)
# vault_password_file = ~/.vault_pass

# Roles path
roles_path          = roles

# SSH settings
host_key_checking   = False
remote_user         = ansible
private_key_file    = ~/.ssh/id_rsa

# Output
stdout_callback     = yaml
bin_ansible_callbacks = True

# Retry files
retry_files_enabled = False

# Forks (parallel hosts)
forks               = 10

# Timeout
timeout             = 30

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining          = True
